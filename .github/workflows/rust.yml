name: Rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: [stable, "1.89.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc
      - run: cargo test --workspace --all-targets --no-default-features --features alloc

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --workspace --all-targets --no-default-features --features alloc -- -D warnings
      - run: cargo clippy --workspace --all-targets --features paranoid -- -D warnings
      - run: cargo test --workspace --all-targets --features paranoid

  i686:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: cargo test --workspace --all-targets --target i686-unknown-linux-gnu

  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path fuzz/Cargo.toml --bins

  interop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        openzl:
          - name: dev
            ref: b75871dfacbfde89935e30af407c430687d656da
            path: tmp/openzl-upstream
            env: OZLRIP_ZLI
            features: dev-format
            tests: upstream_zli_golden upstream_profile_discovery
          - name: v0.2.0
            ref: v0.2.0
            path: tmp/openzl-v0.2.0
            env: OZLRIP_ZLI_V0_2_0
            features: ""
            tests: upstream_release_checkpoint
          - name: v0.1.0
            ref: v0.1.0
            path: tmp/openzl-v0.1.0
            env: OZLRIP_ZLI_V0_1_0
            features: ""
            tests: upstream_release_checkpoint
          - name: v0.0.23
            ref: v0.0.23
            path: tmp/openzl-v0.0.23
            env: OZLRIP_ZLI_V0_0_23
            features: ""
            tests: upstream_release_checkpoint
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check out OpenZL ${{ matrix.openzl.name }}
        uses: actions/checkout@v4
        with:
          repository: facebook/openzl
          ref: ${{ matrix.openzl.ref }}
          path: ${{ matrix.openzl.path }}
      - name: Build zli
        run: make -C "${{ matrix.openzl.path }}" -j4 zli
      - name: Run interop tests
        run: |
          export "${{ matrix.openzl.env }}=$PWD/${{ matrix.openzl.path }}/zli"
          cargo test --test interop --features "${{ matrix.openzl.features }}" \
            -- --ignored ${{ matrix.openzl.tests }}

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test -p ozlrip-decode --no-default-features --features alloc
