[package]
name = "ozlrip-bench"
version = "0.0.0"
edition = "2024"
publish = false
build = "build.rs"

[workspace]

[features]
default = ["ozlrip/default"]
no-checksum = ["ozlrip/default"]
paranoid = ["ozlrip/default", "ozlrip/paranoid"]

[dependencies]
openzl-shim = { path = "../tools/openzl-shim" }
ozlrip = { path = "..", default-features = false }

[[bench]]
name = "decode_profiles"
harness = false
