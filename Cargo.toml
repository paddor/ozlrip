[workspace]
members = [".", "crates/core", "crates/decode", "crates/test-support"]
exclude = ["bench", "fuzz", "interop", "tools/openzl-shim"]
resolver = "3"

[package]
name = "ozlrip"
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
description = "Memory-safe Rust decoder-first implementation of OpenZL"
license = "MIT"
repository = "https://github.com/paddor/ozlrip"
readme = "README.md"
keywords = ["openzl", "compression", "decompression", "decoder"]
categories = ["compression"]
include = [
  "/src/**/*",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/SAFETY.md",
  "/SECURITY.md",
  "/tests/**/*",
]

[features]
default = ["std", "alloc", "zstd", "lz4", "checksum"]
std = ["alloc", "ozlrip-core/std", "ozlrip-decode/std"]
alloc = ["ozlrip-core/alloc", "ozlrip-decode/alloc"]
zstd = ["ozlrip-decode/zstd"]
lz4 = ["ozlrip-decode/lz4"]
checksum = ["ozlrip-core/checksum", "ozlrip-decode/checksum"]
paranoid = ["ozlrip-core/paranoid", "ozlrip-decode/paranoid"]

[dependencies]
ozlrip-core = { version = "0.5.0", path = "crates/core", default-features = false }
ozlrip-decode = { version = "0.5.0", path = "crates/decode", default-features = false }

[dev-dependencies]
ozlrip-test-support = { path = "crates/test-support" }
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh3"] }
zrip = { version = "0.8.5", default-features = false, features = ["std", "frame"] }

[lints]
workspace = true

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
too_many_lines = "allow"
doc_markdown = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
