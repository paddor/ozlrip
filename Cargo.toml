[workspace]
members = [".", "crates/core", "crates/decode"]
exclude = ["bench", "fuzz"]
resolver = "2"

[package]
name = "ozlrip"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Memory-safe Rust decoder-first implementation of OpenZL"
license = "MIT"
repository = "https://github.com/paddor/ozlrip"
readme = "README.md"
keywords = ["openzl", "compression", "decompression", "decoder"]
categories = ["compression"]
include = [
  "src/**/*",
  "crates/**/*",
  "README.md",
  "SAFETY.md",
  "SECURITY.md",
]

[features]
default = ["std", "alloc", "zstd", "lz4", "checksum"]
std = ["alloc", "ozlrip-core/std", "ozlrip-decode/std"]
alloc = ["ozlrip-core/alloc", "ozlrip-decode/alloc"]
zstd = ["ozlrip-decode/zstd"]
lz4 = ["ozlrip-decode/lz4"]
checksum = ["ozlrip-core/checksum", "ozlrip-decode/checksum"]
paranoid = ["ozlrip-core/paranoid", "ozlrip-decode/paranoid"]
dev-format = ["ozlrip-core/dev-format", "ozlrip-decode/dev-format"]
interop = ["std", "ozlrip-decode/interop"]

[dependencies]
ozlrip-core = { version = "0.0.0", path = "crates/core", default-features = false }
ozlrip-decode = { version = "0.0.0", path = "crates/decode", default-features = false }

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
too_many_lines = "allow"
doc_markdown = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
