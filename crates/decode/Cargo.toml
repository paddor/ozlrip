[package]
name = "ozlrip-decode"
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
description = "OpenZL decoder for ozlrip"
license = "MIT"
repository = "https://github.com/paddor/ozlrip"
readme = "README.md"

[lints]
workspace = true

[features]
default = ["std"]
std = [
  "alloc",
  "dep:fearless_simd",
  "ozlrip-core/std",
  "zrip-core/std",
  "zrip-decode?/std",
  "zrip-decode?/simd",
  "lz4rip-decode?/std",
]
alloc = ["ozlrip-core/alloc"]
zstd = ["alloc", "dep:zrip-decode"]
lz4 = ["alloc", "dep:lz4rip-decode"]
checksum = ["dep:xxhash-rust"]
paranoid = [
  "ozlrip-core/paranoid",
  "zrip-core/paranoid",
  "zrip-decode?/paranoid",
  "lz4rip-decode?/paranoid",
]

[dependencies]
ozlrip-core = { version = "0.5.0", path = "../core", default-features = false }
fearless_simd = { version = "1.0.0", default-features = false, features = ["std"], optional = true }
zrip-core = { version = "0.11.0", default-features = false, features = ["alloc"] }
zrip-decode = { version = "0.8.9", default-features = false, features = ["alloc"], optional = true }
lz4rip-decode = { version = "0.10.4", default-features = false, optional = true }
smallvec = { version = "1.15", default-features = false, features = ["const_generics"] }
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh3"], optional = true }

[dev-dependencies]
ozlrip-test-support = { path = "../test-support" }
lz4rip = { version = "0.11.8", default-features = false, features = ["alloc"] }
zrip = { version = "0.8.10", default-features = false, features = ["alloc"] }
