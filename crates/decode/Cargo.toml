[package]
name = "ozlrip-decode"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "OpenZL decoder for ozlrip"
license = "MIT"
repository = "https://github.com/paddor/ozlrip"
readme = "README.md"

[lints]
workspace = true

[features]
default = ["std"]
std = ["alloc", "ozlrip-core/std"]
alloc = ["ozlrip-core/alloc"]
zstd = ["std", "dep:zrip", "zrip/simd"]
lz4 = ["std", "dep:lz4rip"]
checksum = ["ozlrip-core/checksum", "dep:xxhash-rust"]
paranoid = ["ozlrip-core/paranoid"]
dev-format = ["ozlrip-core/dev-format"]
interop = ["std"]

[dependencies]
ozlrip-core = { version = "0.0.0", path = "../core", default-features = false }
zrip-core = { version = "0.9.0", default-features = false, features = ["alloc"] }
zrip = { version = "0.8.3", default-features = false, features = ["std", "frame"], optional = true }
lz4rip = { version = "0.10.1", default-features = false, features = ["std", "frame"], optional = true }
smallvec = { version = "1.15", default-features = false, features = ["const_generics"] }
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh3"], optional = true }

[dev-dependencies]
ozlrip = { path = "../..", default-features = false, features = ["alloc"] }
